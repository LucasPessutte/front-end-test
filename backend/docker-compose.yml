version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: dog-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: doguser
      POSTGRES_PASSWORD: dogpassword
      POSTGRES_DB: dogdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doguser -d dogdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
